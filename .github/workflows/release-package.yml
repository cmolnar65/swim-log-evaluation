name: Release Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build clean plugin package
        run: |
          set -euo pipefail
          chmod +x ./build-release.sh
          ./build-release.sh "$RUNNER_TEMP/chriss-swim-training-progress-evaluation-1.1.zip"

      - name: Upload release package
        uses: actions/upload-artifact@v6
        with:
          name: chriss-swim-training-progress-evaluation-1.1
          path: ${{ runner.temp }}/chriss-swim-training-progress-evaluation-1.1.zip
          if-no-files-found: error
          retention-days: 14

