name: Release Package

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-package.yml'
      - 'build-release.sh'
      - 'build-release.ps1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean plugin package
        run: |
          set -euo pipefail
          chmod +x ./build-release.sh
          ./build-release.sh "$RUNNER_TEMP/chriss-swim-training-progress-evaluation.zip"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: chriss-swim-training-progress-evaluation
          path: ${{ runner.temp }}/chriss-swim-training-progress-evaluation.zip
          if-no-files-found: error
          retention-days: 14
