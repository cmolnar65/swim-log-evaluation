name: Plugin Check Production Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage production plugin without distribution archive
        run: |
          set -euo pipefail
          bash ./build-release.sh --stage-only "$RUNNER_TEMP/plugin-build/chriss-swim-training-progress-evaluation"

      - name: Audit production staging
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/plugin-build/chriss-swim-training-progress-evaluation"
          test -f "$ROOT/composer.json"
          test -f "$ROOT/vendor/autoload.php"
          test -f "$ROOT/blocks/calendar/block.json"
          test -f "$ROOT/blocks/calendar/index.js"
          test -f "$ROOT/blocks/calendar/view.js"
          test -f "$ROOT/assets/css/calendar.css"
          for excluded in .git .github tests wordpress-org-assets assets/wordpress-org-assets composer.lock phpunit.xml.dist build-release.sh build-release.ps1 PLUGIN-CHECK.md docs REST-API.md; do
            test ! -e "$ROOT/$excluded"
          done
          test -z "$(find "$ROOT" -type f -iname '*.pdf' -print -quit)"

      - name: Run WordPress Plugin Check against production staging
        uses: wordpress/plugin-check-action@v1
        with:
          strict: true
          build-dir: ${{ runner.temp }}/plugin-build/chriss-swim-training-progress-evaluation

      - name: Verify historical Garmin traversal and activity retries
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/garmin-history-integration.php)"

      - name: Verify persistent historical jobs and controls
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/garmin-history-jobs-integration.php)" | tee "$RUNNER_TEMP/garmin-history-jobs.log"

      - name: Verify persistent full-range historical jobs and recovery gaps
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/garmin-history-extended-integration.php)"

      - name: Verify historical jobs across separate PHP processes
        run: |
          set -euo pipefail
          wp-env run cli wp eval "define('SWIMLOG_H8_PHASE', 'setup'); $(tail -n +2 tests/garmin-history-restart-integration.php)"
          wp-env run cli wp eval "define('SWIMLOG_H8_PHASE', 'verify'); $(tail -n +2 tests/garmin-history-restart-integration.php)"

      - name: Verify private measurement schema migration
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/health-schema-integration.php)"

      - name: Verify private running and walking import logs and maps
        run: |
          set -euo pipefail
          wp-env run cli wp eval "eval('?>' . base64_decode('$(base64 -w0 tests/land-activity-fixtures.php)')); $(tail -n +2 tests/land-activity-integration.php)" | tee "$RUNNER_TEMP/land-activity.log"

      - name: Verify simpler manual entry and swimming analytics
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/manual-analytics-usability-integration.php)" | tee "$RUNNER_TEMP/manual-analytics-usability.log"

      - name: Verify administrator swimmer context and prescription previews
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/admin-context-editor-integration.php)" | tee "$RUNNER_TEMP/admin-context-editor.log"

      - name: Verify friendly planned entry and failed-save recovery
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/admin-usability-integration.php)" | tee "$RUNNER_TEMP/admin-usability.log"

      - name: Verify Garmin workspace setup and section order
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/garmin-workspace-integration.php)" | tee "$RUNNER_TEMP/garmin-workspace.log"

      - name: Verify pool review matching and four-sport scheduled synchronization
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/pool-match-sync-integration.php)"

      - name: Verify private measurement persistence
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/health-measurement-integration.php)"

      - name: Verify manual Garmin measurement import
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/garmin-measurement-import-integration.php)"

      - name: Verify scheduled Garmin measurement imports
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/garmin-measurement-sync-integration.php)"

      - name: Verify manual scheduled calendar measurement pipeline
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/measurement-pipeline-integration.php)"

      - name: Verify private calendar measurement retrieval
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/calendar-measurement-integration.php)"

      - name: Verify database cache ownership and persistence in WordPress
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/production-staging-smoke.php)"

      - name: Verify training-plan import structures scheduling and permissions
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/training-plan-integration.php)"

      - name: Verify recorded conversion and prescription exports
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/structured-transfer-integration.php)" | tee "$RUNNER_TEMP/structured-transfers.log"
          python -m pip install garmin-fit-sdk==21.218.0
          python tests/verify-structured-fit.py "$RUNNER_TEMP/structured-transfers.log"

      - name: Verify PDF review controls and manually approved selection
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/pdf-review-integration.php)" | tee "$RUNNER_TEMP/pdf-review.log"
          npm install --prefix "$RUNNER_TEMP/swimlog-browser-tests" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/swimlog-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/pdf-review-browser.cjs "$RUNNER_TEMP/pdf-review.log"

      - name: Verify expanded calendar day on desktop and mobile engines
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/calendar-day-integration.php)" | tee "$RUNNER_TEMP/calendar-day.log"
          "$RUNNER_TEMP/swimlog-browser-tests/node_modules/.bin/playwright" install --with-deps webkit
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/calendar-day-browser.cjs "$RUNNER_TEMP/calendar-day.log"

      - name: Verify historical import controls on desktop and mobile
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/garmin-history-browser.cjs "$RUNNER_TEMP/garmin-history-jobs.log"


      - name: Verify private land activity maps on desktop and mobile
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/land-activity-browser.cjs "$RUNNER_TEMP/land-activity.log"


      - name: Verify Garmin workspace on desktop and mobile
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/garmin-workspace-browser.cjs "$RUNNER_TEMP/garmin-workspace.log"

      - name: Verify administration table and recovery layouts on desktop and mobile
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/admin-usability-browser.cjs "$RUNNER_TEMP/admin-usability.log"

      - name: Verify administrator navigation and structured editor accessibility
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/admin-context-editor-browser.cjs "$RUNNER_TEMP/admin-context-editor.log"


      - name: Verify manual and analytics layouts on desktop and mobile
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/manual-analytics-usability-browser.cjs "$RUNNER_TEMP/manual-analytics-usability.log"
