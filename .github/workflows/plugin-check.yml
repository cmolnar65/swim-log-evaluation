name: Plugin Check Production Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage production plugin without distribution archive
        run: |
          set -euo pipefail
          bash ./build-release.sh --stage-only "$RUNNER_TEMP/plugin-build/chriss-swim-training-progress-evaluation"

      - name: Audit production staging
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/plugin-build/chriss-swim-training-progress-evaluation"
          test -f "$ROOT/composer.json"
          test -f "$ROOT/vendor/autoload.php"
          test -f "$ROOT/blocks/calendar/block.json"
          test -f "$ROOT/blocks/calendar/index.js"
          test -f "$ROOT/blocks/calendar/view.js"
          test -f "$ROOT/assets/css/calendar.css"
          for excluded in .git .github tests wordpress-org-assets assets/wordpress-org-assets composer.lock phpunit.xml.dist build-release.sh build-release.ps1 PLUGIN-CHECK.md docs REST-API.md; do
            test ! -e "$ROOT/$excluded"
          done
          test -z "$(find "$ROOT" -type f -iname '*.pdf' -print -quit)"

      - name: Run WordPress Plugin Check against production staging
        uses: wordpress/plugin-check-action@v1
        with:
          strict: true
          build-dir: ${{ runner.temp }}/plugin-build/chriss-swim-training-progress-evaluation

      - name: Verify database cache ownership and persistence in WordPress
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(cat tests/production-staging-smoke.php)"
