name: Plugin Check Production Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage production plugin without distribution archive
        run: |
          set -euo pipefail
          bash ./build-release.sh --stage-only "$RUNNER_TEMP/plugin-build/chriss-swim-training-progress-evaluation"

      - name: Audit production staging
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/plugin-build/chriss-swim-training-progress-evaluation"
          test -f "$ROOT/composer.json"
          test -f "$ROOT/vendor/autoload.php"
          test -f "$ROOT/blocks/calendar/block.json"
          test -f "$ROOT/blocks/calendar/index.js"
          test -f "$ROOT/blocks/calendar/view.js"
          test -f "$ROOT/assets/css/calendar.css"
          for excluded in .git .github tests wordpress-org-assets assets/wordpress-org-assets composer.lock phpunit.xml.dist build-release.sh build-release.ps1 PLUGIN-CHECK.md docs REST-API.md; do
            test ! -e "$ROOT/$excluded"
          done
          test -z "$(find "$ROOT" -type f -iname '*.pdf' -print -quit)"

      - name: Run WordPress Plugin Check against production staging
        uses: wordpress/plugin-check-action@v1
        with:
          strict: true
          build-dir: ${{ runner.temp }}/plugin-build/chriss-swim-training-progress-evaluation

      - name: Verify private measurement schema migration
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/health-schema-integration.php)"

      - name: Verify private measurement persistence
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/health-measurement-integration.php)"

      - name: Verify database cache ownership and persistence in WordPress
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/production-staging-smoke.php)"

      - name: Verify training-plan import structures scheduling and permissions
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/training-plan-integration.php)"

      - name: Verify recorded conversion and prescription exports
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/structured-transfer-integration.php)" | tee "$RUNNER_TEMP/structured-transfers.log"
          python -m pip install garmin-fit-sdk==21.218.0
          python tests/verify-structured-fit.py "$RUNNER_TEMP/structured-transfers.log"

      - name: Verify PDF review controls and manually approved selection
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/pdf-review-integration.php)" | tee "$RUNNER_TEMP/pdf-review.log"
          npm install --prefix "$RUNNER_TEMP/swimlog-browser-tests" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/swimlog-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/pdf-review-browser.cjs "$RUNNER_TEMP/pdf-review.log"

      - name: Verify expanded calendar day on desktop and mobile engines
        run: |
          set -euo pipefail
          wp-env run cli wp eval "$(tail -n +2 tests/calendar-day-integration.php)" | tee "$RUNNER_TEMP/calendar-day.log"
          "$RUNNER_TEMP/swimlog-browser-tests/node_modules/.bin/playwright" install --with-deps webkit
          NODE_PATH="$RUNNER_TEMP/swimlog-browser-tests/node_modules" node tests/calendar-day-browser.cjs "$RUNNER_TEMP/calendar-day.log"
